# Static files only. No server-side code, no uploads, no forms, nothing that runs per request.
server_tokens off;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # One address for everyone: send www to the bare domain.
  if ($host = www.earlythesis.com) {
    return 301 https://earlythesis.com$request_uri;
  }

  # Only reading is allowed.
  if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
  }
  client_max_body_size 1k;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Never serve hidden files such as .env or .git, even if one ended up here by mistake.
  location ~ /\. {
    return 404;
  }

  # Files with a fingerprint in their name never change, so browsers may keep them.
  location /assets/ {
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
